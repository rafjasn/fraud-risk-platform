apiVersion: v1
kind: Service
metadata:
  name: {{ include "frp.apiHost" . }}
  labels:
    {{- include "frp.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "frp.selectorLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frp.apiHost" . }}
  labels:
    {{- include "frp.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  # A new pod takes traffic only once /ready reports its release loaded and verified, and
  # no old pod stops before then, so a release that fails to load never serves.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "frp.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "frp.labels" (dict "ctx" $ "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "frp.fullname" . }}
      securityContext:
        {{- include "frp.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "frp.image" .Values.images.serving }}
          imagePullPolicy: {{ .Values.images.serving.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "frp.fullname" . }}
          env:
            {{- include "frp.databaseEnv" (dict "ctx" $ "sourceRole" "source_reader") | nindent 12 }}
            {{- with .Values.api.releaseId }}
            - name: MODEL_RELEASE_ID
              value: {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          # 503 until a release is deployed and both databases answer.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "frp.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /state
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "frp.fullname" . }}-state
            readOnly: true
        - name: tmp
          emptyDir: {}
