{{- if not .Values.credentials.existingSecret }}
# Credentials from values. To supply your own, create a Secret with these keys and set
# credentials.existingSecret to its name.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "frp.fullname" . }}
  labels:
    {{- include "frp.labels" (dict "ctx" $ "component" "platform") | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.credentials.postgresPassword | quote }}
  source-app-password: {{ .Values.credentials.sourceAppPassword | quote }}
  source-reader-password: {{ .Values.credentials.sourceReaderPassword | quote }}
  platform-app-password: {{ .Values.credentials.platformAppPassword | quote }}
  mlflow-app-password: {{ .Values.credentials.mlflowAppPassword | quote }}
  aws-access-key-id: {{ .Values.credentials.awsAccessKeyId | quote }}
  aws-secret-access-key: {{ .Values.credentials.awsSecretAccessKey | quote }}
{{- end }}
